<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RFSee RFC Browser</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
    }
